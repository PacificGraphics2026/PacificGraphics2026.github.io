<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth; scroll-padding-top: 100px;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organizers & Support | Pacific Graphics 2026 (PG2026)</title>
    <link rel="icon" type="image/png" href="pg26_files/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        .design-card {
            background-color: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); border: 1px solid var(--line-color);
            border-top: 4px solid var(--theme-accent); border-radius: 1.5rem; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); transition: all 0.3s ease;
        }
        .design-card:hover { border-color: rgba(0, 255, 255, 0.4); box-shadow: 0 10px 40px -10px rgba(0, 255, 255, 0.15); transform: translateY(-4px); }
        :root { --bg-main: #06111D; --theme-accent: #00FFFF; --line-color: #1A2233; --font-heading: 'Montserrat', sans-serif; --font-body: 'Montserrat', sans-serif; }
        body { color: #E2E8F0; font-family: var(--font-body); overflow-x: hidden; position: relative; }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(to right, var(--line-color) 1px, transparent 1px), linear-gradient(to bottom, var(--line-color) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -2; opacity: 0.2;
        }
        h1, h2, h3, h4, h5, .font-heading { font-family: var(--font-heading); letter-spacing: 0.15em; line-height: 1.1; font-weight: 700; color: #FFFFFF; }
        .header-logo-container { width: 250px; height: 100px; overflow: hidden; display: flex; align-items: center; margin-right: 2rem; }
        .header-logo-container img { filter: brightness(1.5) contrast(1.2); transition: filter 0.3s; }
        .nav-link { position: relative; padding: 0.5rem 0; transition: color 0.3s; letter-spacing: 0.05em; }
        .nav-link:hover, .nav-link.active { color: var(--theme-accent); } 
        .nav-link::after { content: ''; position: absolute; width: 100%; height: 2px; bottom: -2px; left: 0; background-color: var(--theme-accent); transform: scaleX(0); transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); }
        #scroll-progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background-color: var(--theme-accent); z-index: 100; transition: width 0.1s linear; }
    </style>
</head>

<body>
    <div class="fixed inset-0 z-[-1] bg-[var(--bg-main)]">
        <img src="pg26_files/pg26_bg3.jpg" alt="BG" class="w-full h-full object-cover opacity-20 brightness-75" />
    </div>
    <div id="scroll-progress"></div>
    <header class="fixed w-full top-0 z-50 bg-[var(--bg-main)]/95 backdrop-blur-sm border-b border-[var(--line-color)]">
        <div class="w-full xl:w-fit max-w-full mx-auto px-5 h-24 flex items-center justify-between xl:justify-center">
            <a href="index.html#hero" class="header-logo-container" style="width:210px;height:96px;margin-right:1rem;flex-shrink:0;">
                <img src="pg26_files/PG2026_Logo_png.png" alt="Pacific Graphics 2026 Logo" class="h-full w-auto object-contain" />
            </a>

            <a href="program.html" class="xl:hidden ml-auto inline-flex items-center rounded-full border border-[var(--theme-accent)] px-4 py-2 text-sm font-bold tracking-[0.14em] text-[var(--theme-accent)]">PROGRAM</a>

            <nav class="hidden xl:flex ml-4 gap-2 2xl:gap-5 text-[0.95rem] 2xl:text-lg font-semibold uppercase text-white items-center" id="main-nav" aria-label="Main navigation">
                <a href="index.html#about" data-nav="about" class="nav-link">ABOUT</a>

                <div class="relative group py-4">
                    <a href="cfp.html" data-nav="calls" class="nav-link flex items-center gap-1">CALLS
                        <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></a>
                    <div class="absolute left-0 top-full mt-[-10px] w-64 bg-[#06111D]/95 backdrop-blur-md border border-[var(--line-color)] rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible group-focus-within:opacity-100 group-focus-within:visible transition-all duration-300 shadow-2xl overflow-hidden z-50">
                        <a href="cfp.html" class="block px-5 py-4 text-sm text-slate-300 hover:text-[var(--theme-accent)] hover:bg-white/5 transition-colors border-b border-white/5 tracking-wider font-heading">CALL FOR PAPERS</a>
                        <a href="sponsorships.html" class="block px-5 py-4 text-sm text-slate-300 hover:text-[var(--theme-accent)] hover:bg-white/5 transition-colors tracking-wider font-heading">CALL FOR SPONSORSHIPS</a>
                    </div>
                </div>

                <a href="program.html" data-nav="program" class="nav-link">PROGRAM</a>
                <a href="registration.html" data-nav="registration" class="nav-link">REGISTRATION</a>
                <a href="index.html#keynotes" data-nav="keynotes" class="nav-link">KEYNOTES</a>
                <a href="index.html#committee" data-nav="committee" class="nav-link">COMMITTEE</a>
                <a href="support.html" data-nav="support" class="nav-link active" aria-current="page">SUPPORT</a>

                <div class="relative group py-4">
                    <a href="venue.html" data-nav="attend" class="nav-link flex items-center gap-1">ATTEND
                        <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></a>
                    <div class="absolute right-0 top-full mt-[-10px] w-48 bg-[#06111D]/95 backdrop-blur-md border border-[var(--line-color)] rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible group-focus-within:opacity-100 group-focus-within:visible transition-all duration-300 shadow-2xl overflow-hidden z-50">
                        <a href="venue.html" class="block px-5 py-4 text-sm text-slate-300 hover:text-[var(--theme-accent)] hover:bg-white/5 transition-colors border-b border-white/5 tracking-wider font-heading">VENUE</a>
                        <a href="hotels.html" class="block px-5 py-4 text-sm text-slate-300 hover:text-[var(--theme-accent)] hover:bg-white/5 transition-colors tracking-wider font-heading">HOTELS</a>
                    </div>
                </div>

                <a href="history.html" data-nav="history" class="nav-link">HISTORY</a>
            </nav>
        </div>
    </header>

    <main class="pt-32 pb-20 min-h-[80vh]">
        <div class="text-center mb-16">
            <h1 class="text-5xl text-white font-heading mb-6 tracking-widest uppercase">Organizers & Support</h1>
            <div class="w-32 h-1 bg-[var(--theme-accent)] mx-auto rounded-full shadow-[0_0_15px_var(--theme-accent)]"></div>
        </div>

        <section class="max-w-6xl mx-auto px-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-stretch">
                <div class="design-card flex flex-col items-center gap-4 p-8 group">
                    <div class="h-24 w-full flex items-center justify-center p-4 bg-white/95 rounded-xl mb-2 transition-transform duration-500 group-hover:scale-105 shadow-inner">
                        <img src="pg26_files/smu.png" alt="SMU" class="h-full w-auto object-contain filter brightness(1.1)" />
                    </div>
                    <div class="text-center w-full flex-1 flex items-center justify-center mt-2">
                        <div class="font-heading text-lg text-white leading-tight">School of Computing and Information Systems, SMU</div>
                    </div>
                </div>
                <div class="design-card flex flex-col items-center gap-4 p-8 group">
                    <div class="h-24 w-full flex items-center justify-center p-4 bg-white/95 rounded-xl mb-2 transition-transform duration-500 group-hover:scale-105 shadow-inner">
                        <img src="pg26_files/ag.png" alt="Pacific Graphics Society" class="h-full w-auto object-contain filter brightness(1.1)" />
                    </div>
                    <div class="text-center w-full flex-1 flex items-center justify-center mt-2">
                        <div class="font-heading text-lg text-white leading-tight">Asia <br> Graphics</div>
                    </div>
                </div>
                <div class="design-card flex flex-col items-center gap-4 p-8 group">
                    <div class="h-24 w-full flex items-center justify-center p-4 bg-white/95 rounded-xl mb-2 transition-transform duration-500 group-hover:scale-105 shadow-inner">
                        <img src="pg26_files/eg.jpg" alt="Eurographics" class="h-full w-auto object-contain filter brightness(1.1)" />
                    </div>
                    <div class="text-center w-full flex-1 flex items-center justify-center mt-2">
                        <div class="font-heading text-lg text-white leading-tight">Eurographics Association</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <footer class="border-t border-[var(--line-color)] py-8 text-center text-sm text-[var(--line-color)] font-body tracking-wider">
        <p>© PG 2026. ALL RIGHTS RESERVED.</p>
    </footer>

    <script>
        const navLinks = document.querySelectorAll(".nav-link");
        const scrollProgress = document.getElementById("scroll-progress");

        window.addEventListener("scroll", () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            if (scrollProgress) {
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                scrollProgress.style.width = scrolled + "%";
            }
        });

        const currentPath = window.location.pathname.split("/").pop() || "index.html";
        navLinks.forEach((link) => {
            link.classList.remove("active");
            const linkHref = link.getAttribute("href");
            if (linkHref.includes(currentPath) && currentPath !== "index.html") {
                link.classList.add("active");
            } else if ((currentPath === "index.html" || currentPath === "") && linkHref.includes("index.html")) {
                if (window.location.hash && linkHref.includes(window.location.hash)) { link.classList.add("active"); }
            }
        });
    </script>
    <script>
        (() => {
            const syncNavigationState = () => {
                const page = window.location.pathname.split('/').pop() || 'index.html';
                const sectionByPage = {
                    'cfp.html': 'calls',
                    'sponsorships.html': 'calls',
                    'program.html': 'program',
                    'registration.html': 'registration',
                    'support.html': 'support',
                    'venue.html': 'attend',
                    'hotels.html': 'attend',
                    'history.html': 'history'
                };
                let activeSection = sectionByPage[page];

                if (page === 'index.html' || page === '') {
                    activeSection = {
                        '#about': 'about',
                        '#keynotes': 'keynotes',
                        '#committee': 'committee'
                    }[window.location.hash] || 'about';
                }

                document.querySelectorAll('[data-nav]').forEach((link) => {
                    const isActive = link.dataset.nav === activeSection;
                    link.classList.toggle('active', isActive);
                    if (isActive) link.setAttribute('aria-current', 'page');
                    else link.removeAttribute('aria-current');
                });
            };

            syncNavigationState();
            window.addEventListener('hashchange', syncNavigationState);
        })();
    </script>
</body>
</html>
